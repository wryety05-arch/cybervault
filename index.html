<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberVault Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151b26;
            --accent: #00f2fe;
            --accent-grad: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --text-main: #ffffff;
            --text-muted: #8a94a6;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 14px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent-grad);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
        }

        .balance-section {
            text-align: center;
            margin: 24px 0;
        }

        .balance-label {
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-amount {
            font-size: 42px;
            font-weight: 800;
            margin: 6px 0;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .vault-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }

        .vault-circle {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            border: 3px solid var(--accent);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.1s;
        }

        .vault-circle:active {
            transform: scale(0.95);
        }

        .mined-now {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }

        .mining-rate {
            font-size: 12px;
            color: var(--accent);
            margin-top: 4px;
        }

        .storage-box {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            margin-top: 16px;
        }

        .storage-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .progress-bg {
            width: 100%;
            height: 10px;
            background: #0b0e14;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-grad);
            transition: width 0.3s ease;
        }

        .claim-btn {
            width: 100%;
            margin-top: 14px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--accent-grad);
            color: #000;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .claim-btn:disabled {
            background: #2a3441;
            color: #64748b;
            cursor: not-allowed;
        }

        .upgrades {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .upgrade-card {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .up-title {
            font-size: 14px;
            font-weight: 600;
        }

        .up-lvl {
            font-size: 12px;
            color: var(--accent);
            margin: 4px 0 10px 0;
        }

        .up-btn {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--accent);
            background: rgba(0, 242, 254, 0.1);
            color: var(--text-main);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .up-btn:disabled {
            border-color: #334155;
            background: transparent;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <div class="avatar" id="avatar">U</div>
            <span id="username">Miner</span>
        </div>
        <div style="font-size: 12px; color: var(--accent); font-weight: 600;">CyberVault v1.0</div>
    </div>

    <div class="balance-section">
        <div class="balance-label">Твой баланс</div>
        <div class="balance-amount"><span id="balance">0.00</span> $VLT</div>
    </div>

    <div class="vault-container">
        <div class="vault-circle" onclick="tapVault()">
            <div style="font-size: 28px; margin-bottom: 4px;">🔐</div>
            <div class="mined-now" id="mined">0.000</div>
            <div class="mining-rate">+<span id="rate-display">0.00</span> / сек</div>
        </div>
    </div>

    <div class="storage-box">
        <div class="storage-header">
            <span>Заполнение сейфа</span>
            <span><span id="storage-pct">0</span>% (Макс: <span id="max-cap">10</span>)</span>
        </div>
        <div class="progress-bg">
            <div class="progress-fill" id="progress-bar"></div>
        </div>
        <button class="claim-btn" id="claim-btn" onclick="claimTokens()">Забрать токены</button>
    </div>

    <div class="upgrades">
        <div class="upgrade-card">
            <div>
                <div class="up-title">⚡ Дешифратор</div>
                <div class="up-lvl">Уровень <span id="speed-lvl">1</span></div>
            </div>
            <button class="up-btn" id="btn-speed" onclick="upgradeSpeed()">Улучшить (<span id="speed-cost">5</span> $VLT)</button>
        </div>

        <div class="upgrade-card">
            <div>
                <div class="up-title">📦 Объем сейфа</div>
                <div class="up-lvl">Уровень <span id="cap-lvl">1</span></div>
            </div>
            <button class="up-btn" id="btn-cap" onclick="upgradeCap()">Улучшить (<span id="cap-cost">5</span> $VLT)</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0b0e14');

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('username').innerText = user.first_name || user.username || 'Miner';
            document.getElementById('avatar').innerText = (user.first_name || 'M')[0].toUpperCase();
        }

        let state = JSON.parse(localStorage.getItem('cybervault_save')) || {
            balance: 0,
            speedLvl: 1,
            capLvl: 1,
            lastClaim: Date.now()
        };

        function getRate() {
            return +(0.005 * Math.pow(1.4, state.speedLvl - 1)).toFixed(4);
        }

        function getMaxCap() {
            return +(10 * Math.pow(1.5, state.capLvl - 1)).toFixed(2);
        }

        function getSpeedCost() {
            return +(5 * Math.pow(1.8, state.speedLvl - 1)).toFixed(2);
        }

        function getCapCost() {
            return +(5 * Math.pow(1.8, state.capLvl - 1)).toFixed(2);
        }

        function getMinedAmount() {
            const secondsPassed = (Date.now() - state.lastClaim) / 1000;
            const rawMined = secondsPassed * getRate();
            return Math.min(rawMined, getMaxCap());
        }

        function saveState() {
            localStorage.setItem('cybervault_save', JSON.stringify(state));
        }

        function tapVault() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            state.lastClaim -= 1000;
            updateUI();
        }

        function claimTokens() {
            const mined = getMinedAmount();
            if (mined < 0.01) return;

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            state.balance = +(state.balance + mined).toFixed(4);
            state.lastClaim = Date.now();
            saveState();
            updateUI();
        }

        function upgradeSpeed() {
            const cost = getSpeedCost();
            if (state.balance >= cost) {
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                state.balance = +(state.balance - cost).toFixed(4);
                state.speedLvl++;
                saveState();
                updateUI();
            }
        }

        function upgradeCap() {
            const cost = getCapCost();
            if (state.balance >= cost) {
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                state.balance = +(state.balance - cost).toFixed(4);
                state.capLvl++;
                saveState();
                updateUI();
            }
        }

        function updateUI() {
            const mined = getMinedAmount();
            const maxCap = getMaxCap();
            const pct = Math.min(100, (mined / maxCap) * 100);
            const speedCost = getSpeedCost();
            const capCost = getCapCost();

            document.getElementById('balance').innerText = state.balance.toFixed(2);
            document.getElementById('mined').innerText = mined.toFixed(4);
            document.getElementById('rate-display').innerText = getRate();
            document.getElementById('max-cap').innerText = maxCap;
            document.getElementById('storage-pct').innerText = Math.floor(pct);
            document.getElementById('progress-bar').style.width = pct + '%';

            document.getElementById('claim-btn').disabled = mined < 0.01;

            document.getElementById('speed-lvl').innerText = state.speedLvl;
            document.getElementById('speed-cost').innerText = speedCost;
            document.getElementById('btn-speed').disabled = state.balance < speedCost;

            document.getElementById('cap-lvl').innerText = state.capLvl;
            document.getElementById('cap-cost').innerText = capCost;
            document.getElementById('btn-cap').disabled = state.balance < capCost;
        }

        setInterval(updateUI, 100);
        updateUI();
    </script>
</body>
</html>
